<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="kitsuneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="64" height="64" rx="14" fill="#18181b"/>
  <!-- Fox Ears and Head (Geometric Origami Silhouette) -->
  <polygon points="14,16 26,34 16,36" fill="url(#kitsuneGrad)"/>
  <polygon points="50,16 48,36 38,34" fill="url(#kitsuneGrad)"/>
  <polygon points="26,34 38,34 32,48" fill="url(#kitsuneGrad)"/>
  <polygon points="20,28 32,22 44,28 38,34 26,34" fill="#f97316"/>
  <!-- Fox Muzzle / Cheeks (White Accents) -->
  <polygon points="26,34 32,44 22,38" fill="url(#whiteGrad)"/>
  <polygon points="38,34 42,38 32,44" fill="url(#whiteGrad)"/>
  <!-- Nose Tip -->
  <circle cx="32" cy="46" r="2.5" fill="#18181b"/>
</svg>
