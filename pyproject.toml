[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "saturn"
version = "0.1.0"
description = "Boîte à outils modulaire et local-first pour les bureaux Linux"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# Viennent des paquets système (Debian/Kali) : PyGObject (`python3-gi`) pour le démon,
# PySide6 + modules QML (`python3-pyside6.qtquick`, `qml6-module-qtquick-*`) pour l'interface.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
saturnd = "saturn.daemon:main"

[project.gui-scripts]
saturn = "saturn.ui.app:main"

[tool.setuptools.packages.find]
include = ["saturn*"]

[tool.setuptools.package-data]
"saturn.ui" = ["qml/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Avertissements internes de PyGObject (gi.events) sous Python 3.14.
    "ignore::DeprecationWarning:gi.events",
]

[tool.ruff]
line-length = 100
target-version = "py312"
